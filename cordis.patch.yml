# Disable the eight version-checked providers, insert their compatible
# replacements, declare the Codex preset, then register its Runtime. The stock
# conversation UI and default Agent Loop remain active.
- id: agent
  name: '@deepseek-ai/dsh-agent'
  disabled: true

- id: session-controller
  name: '@deepseek-ai/dsh-api-session-controller'
  disabled: true

- id: agent-preset-registry
  name: '@deepseek-ai/dsh-agent-preset-registry'
  disabled: true

- id: config-editor
  name: '@deepseek-ai/dsh-config-editor'
  disabled: true

- id: permission
  name: '@deepseek-ai/dsh-permission-presets'
  disabled: true

- id: ui-permission
  name: '@deepseek-ai/dsh-client-ui-permission-presets'
  disabled: true

- id: ui-chat
  name: '@deepseek-ai/dsh-client-ui-chat'
  disabled: true

- id: ui-trajectory
  name: '@deepseek-ai/dsh-client-ui-trajectory'
  disabled: true

- insert:
    - id: embedded-codex-agent-registry
      name: 'dsh-embedded-codex/compat/agent-registry'

    # Loader uses the last row for a duplicate id. Retaining the official id is
    # required because the stock Agent Preset UI writes this settings namespace.
    - id: agent-preset-registry
      name: 'dsh-embedded-codex/compat/agent-preset-registry'
      config:
        default: standard

    # The stock editor resolves duplicate ids first-wins while Loader uses the
    # final row. This replacement keeps writable settings aligned with Loader.
    - id: embedded-codex-config-editor
      name: 'dsh-embedded-codex/compat/config-editor'

    - id: embedded-codex-permission-presets
      name: 'dsh-embedded-codex/compat/permission-presets'
      config:
        presets:
          read-only:
            sandbox: read-only
            approval: ask
          workspace-write:
            sandbox: workspace-write
            approval: ask
          danger-full-access:
            sandbox: danger-full-access
            approval: never

    - id: embedded-codex-session-controller
      name: 'dsh-embedded-codex/compat/session-controller'

    - id: embedded-codex-ui-permission-presets
      name: 'dsh-embedded-codex/compat/ui-permission-presets'

    - id: ui-chat
      name: 'dsh-embedded-codex/compat/ui-chat'

    - id: ui-trajectory
      name: 'dsh-embedded-codex/compat/ui-trajectory'

    - id: preset-embedded-codex
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: embedded-codex
        name: Embedded Codex
        description: Codex App Server runtime
        order: 100
        plugins: []

    - id: embedded-codex
      name: 'dsh-embedded-codex'
